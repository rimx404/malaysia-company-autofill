<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Malaysia Company Research V6</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font: 15px system-ui, Arial, sans-serif;
      color: #142f49;
      padding: 16px;
      margin: 0;
      background: #ffffff;
    }

    h1 {
      font-size: 22px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 18px;
      margin-top: 20px;
    }

    h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    p {
      line-height: 1.5;
    }

    #status {
      white-space: pre-wrap;
      background: #eef5f6;
      padding: 14px;
      border-radius: 10px;
      overflow-wrap: anywhere;
      margin-top: 14px;
    }

    #results {
      margin-top: 18px;
    }

    .candidate {
      border: 1px solid #cbd5df;
      border-radius: 10px;
      padding: 14px;
      margin: 12px 0;
      background: #ffffff;
      overflow-wrap: anywhere;
    }

    button {
      padding: 12px 14px;
      margin: 8px 6px 8px 0;
      border: 1px solid #16865d;
      border-radius: 8px;
      background: #16865d;
      color: white;
      font-size: 14px;
      cursor: pointer;
      min-height: 44px;
    }

    button:disabled {
      opacity: 0.7;
      cursor: default;
    }

    #retry {
      background: #ffffff;
      color: #142f49;
      border-color: #cbd5df;
    }

    a {
      color: #0969da;
      overflow-wrap: anywhere;
      display: inline-block;
      margin: 6px 0;
    }

    .small {
      font-size: 13px;
      color: #536779;
    }

    .notice {
      background: #fff8e7;
      border: 1px solid #f0dca8;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <h1>Malaysia Company Research — V6</h1>

  <p>
    Review-first research and safe approval for
    <strong>Company Master</strong>,
    column D, row 7 onward.
  </p>

  <div class="notice">
    <strong>Safety:</strong>
    Company search results are not automatically verified.
    You must approve before any note is saved.
    Existing values and formulas will not be overwritten.
  </div>

  <div id="status" role="status" aria-live="polite">
    Loading JavaScript...
  </div>

  <button id="retry" type="button">
    Retry connection
  </button>

  <div id="results" aria-live="polite"></div>

  <script src="taskpane.js?v=6-save"></script>
</body>
</html>
